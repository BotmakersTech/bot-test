# ── Local development overrides ──────────────────────────────────────────
# Active by default (see application.properties) whenever SPRING_PROFILES_ACTIVE
# isn't set — i.e. every local IDE/mvn run.

# Frontend dev servers only — the real prod domain lives in application-prod.properties.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# See exactly what Hibernate sends without digging through DB logs.
spring.jpa.show-sql=true

logging.level.com.botleague=DEBUG
